[package]
name = "permission-lsp"
version = "0.0.0"
edition = "2021"
description = "Language server that shows Rust R/W/O permissions on hover, powered by Aquascope."
license = "MIT"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp-server = "0.23.0"
